<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrix Inverse &amp; Linear System Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #ffffff; --paper: #f8f9fa; --ink: #202124; --soft: #5f6368; --line: #dadce0;
    --accent: #1a73e8; --accent-bg: #e8f0fe; --on-accent: #ffffff; --bad: #d93025; --bad-bg: #fce8e6;
    --g-blue: #4285f4; --g-red: #ea4335; --g-yellow: #fbbc04; --g-green: #34a853;
    --cx: #1a73e8; --cx-bg: #e8f0fe; --cy: #d93025; --cy-bg: #fce8e6; --cz: #188038; --cz-bg: #e6f4ea;
    --cw: #b06000; --cw-bg: #fef7e0; --cv: #8430ce; --cv-bg: #f3e8fd; --cu: #007b83; --cu-bg: #e4f7fb;
    color-scheme: light;
    --display: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202124; --paper: #292a2d; --ink: #e8eaed; --soft: #9aa0a6; --line: #3c4043;
    --accent: #8ab4f8; --accent-bg: #2a3b57; --on-accent: #202124; --bad: #f28b82; --bad-bg: #4a2c2a;
    --g-blue: #8ab4f8; --g-red: #f28b82; --g-yellow: #fdd663; --g-green: #81c995;
    --cx: #8ab4f8; --cx-bg: #2a3b57; --cy: #f28b82; --cy-bg: #4a2c2a; --cz: #81c995; --cz-bg: #213d2c;
    --cw: #fdd663; --cw-bg: #4a3c14; --cv: #d7aefb; --cv-bg: #3a2452; --cu: #78d9ec; --cu-bg: #1c3d44;
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #202124; --paper: #292a2d; --ink: #e8eaed; --soft: #9aa0a6; --line: #3c4043;
    --accent: #8ab4f8; --accent-bg: #2a3b57; --on-accent: #202124; --bad: #f28b82; --bad-bg: #4a2c2a;
    --g-blue: #8ab4f8; --g-red: #f28b82; --g-yellow: #fdd663; --g-green: #81c995;
    --cx: #8ab4f8; --cx-bg: #2a3b57; --cy: #f28b82; --cy-bg: #4a2c2a; --cz: #81c995; --cz-bg: #213d2c;
    --cw: #fdd663; --cw-bg: #4a3c14; --cv: #d7aefb; --cv-bg: #3a2452; --cu: #78d9ec; --cu-bg: #1c3d44;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 16px/1.5 var(--display); background-color: var(--bg); }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 10;
    background: linear-gradient(90deg, var(--g-blue) 0 25%, var(--g-red) 25% 50%, var(--g-yellow) 50% 75%, var(--g-green) 75% 100%); }
  .wrap { position: relative; max-width: 820px; margin: 0 auto; padding: 56px 20px 72px; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: clamp(34px, 6.5vw, 56px); line-height: 1.02; text-wrap: balance; letter-spacing: -.03em; font-weight: 500; margin: 0 0 16px; }
  .formula { font-family: var(--mono); font-weight: 500; color: var(--accent); background: var(--accent-bg); padding: 1px 8px; border-radius: 4px; }
  .muted { color: var(--soft); font-size: 15px; margin: 0; max-width: 56ch; }

  /* sections are separated by heavy rules, not boxed in cards */
  .sec { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 34px; }
  .sec h2 { font-size: 22px; font-weight: 500; letter-spacing: -.01em; margin: 0 0 16px; }

  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  /* tabs for the choices */
  .seg { display: flex; gap: 24px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
  label.choice { padding: 8px 0; margin-bottom: -2px; border-bottom: 3px solid transparent; cursor: pointer;
                 font-weight: 500; font-size: 16px; color: var(--soft); transition: color .15s, border-color .15s; }
  label.choice:hover { color: var(--ink); }
  label.choice:has(input:checked) { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
  label.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.choice input { position: absolute; opacity: 0; pointer-events: none; }

  .stepper { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--soft); font-size: 15px; }
  .stepper b { font-family: var(--mono); font-size: 18px; color: var(--ink); min-width: 1ch; text-align: center; }
  button { font: inherit; color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; width: 32px; height: 32px;
           padding: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; transition: background .15s, color .15s; }
  button:hover { background: var(--ink); color: var(--bg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #theme { width: 40px; height: 40px; font-size: 19px; flex: none; margin-top: 6px; }
  #solve { width: auto; height: auto; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent);
           padding: 12px 34px; font-size: 16px; font-weight: 500; }
  #solve:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.1); }
  #solve:active { transform: translateY(1px); }
  .rand { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 18px; padding: 12px 16px;
          background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
  .rand .check { margin-top: 0; }
  .rand .opt { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--soft); }
  .rand input.rng { width: 84px; padding: 6px 8px; text-align: center; font: 500 15px var(--mono); color: var(--ink);
                    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .rand input.rng:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rand input.rng.bad { border-color: var(--bad); background: var(--bad-bg); }
  .rand label.opt { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--soft); }
  .rand select { font: 500 15px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                 border-radius: 8px; padding: 5px 6px; cursor: pointer; }
  .rand select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #randomize { width: auto; height: auto; border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
               color: var(--accent); padding: 9px 20px; font-size: 15px; font-weight: 500; }
  #randomize:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  #randomize:active { transform: translateY(1px); }
  .output-row { justify-content: space-between; align-items: flex-end; }

  [hidden] { display: none !important; }
  label.choice:has(input:disabled) { opacity: .4; cursor: not-allowed; }
  label.choice:has(input:disabled):hover { color: var(--soft); }
  .check:has(input:disabled), .check input:disabled { cursor: not-allowed; }
  .check:has(input:disabled) { opacity: .65; }
  .options-row { margin-top: 22px; }
  .options-row .check { margin-top: 0; }
  .checks { display: flex; flex-wrap: wrap; gap: 0 26px; }
  .check { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; cursor: pointer; font-size: 15px; color: var(--soft); }
  .check input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 0; border: 2px solid var(--ink);
                 border-radius: 5px; display: grid; place-items: center; cursor: pointer; background: transparent; }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after { content: "✓"; color: var(--on-accent); font-size: 14px; font-weight: 700; line-height: 1; }
  .check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #inputs { margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
  input.cell { width: 64px; padding: 8px 4px; text-align: center; border: 2px solid var(--line); border-radius: 6px;
               font: 500 16px var(--mono); background: var(--paper); color: var(--ink); transition: border-color .15s; }
  input.cell:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input.cell.c0 { border-color: color-mix(in srgb, var(--cx) 50%, var(--line)); }
  input.cell.c1 { border-color: color-mix(in srgb, var(--cy) 50%, var(--line)); }
  input.cell.c2 { border-color: color-mix(in srgb, var(--cz) 50%, var(--line)); }
  input.cell.c0:focus { outline-color: var(--cx); }
  input.cell.c1:focus { outline-color: var(--cy); }
  input.cell.c2:focus { outline-color: var(--cz); }
  input.cell.c3 { border-color: color-mix(in srgb, var(--cw) 50%, var(--line)); }
  input.cell.c4 { border-color: color-mix(in srgb, var(--cv) 50%, var(--line)); }
  input.cell.c3:focus { outline-color: var(--cw); }
  input.cell.c4:focus { outline-color: var(--cv); }
  input.cell.c5 { border-color: color-mix(in srgb, var(--cu) 50%, var(--line)); }
  input.cell.c5:focus { outline-color: var(--cu); }
  input.cell.bad { border-color: var(--bad); background: var(--bad-bg); }
  .equation { display: flex; gap: 8px; align-items: center; margin: 10px 0; color: var(--soft); font: 500 17px var(--mono); white-space: nowrap; }
  select.op { font: 500 17px var(--mono); color: var(--ink); background-color: var(--paper); border: 2px solid var(--line);
              border-radius: 6px; padding: 5px 2px; cursor: pointer; }
  select.op option, .rand select option { background-color: var(--paper); color: var(--ink); }
  select.op:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #warning { min-height: 22px; color: var(--bad); font-size: 14px; margin-top: 10px; }

  /* the unknowns: small outlined badges */
  .v { display: inline-grid; place-items: center; min-width: 30px; height: 30px; border-radius: 6px; font: 700 16px var(--mono); font-style: normal;
       color: var(--accent); background: var(--accent-bg); }

  .v0 { color: var(--cx); background: var(--cx-bg); }
  .v1 { color: var(--cy); background: var(--cy-bg); }
  .v2 { color: var(--cz); background: var(--cz-bg); }
  .v3 { color: var(--cw); background: var(--cw-bg); }
  .v4 { color: var(--cv); background: var(--cv-bg); }
  .v5 { color: var(--cu); background: var(--cu-bg); }

  /* real brackets: curved sides on a left/right-only border */
  .matrix { display: inline-grid; gap: 8px 10px; padding: 8px 16px; border: 2px solid var(--ink); border-top: 0; border-bottom: 0;
            border-radius: 22px; font-family: var(--mono); }
  .matrix span { min-width: 44px; text-align: center; }
  .matrix.aug { gap: 0; padding: 8px 12px; font-size: 14px; }
  .aug span { padding: 4px 8px; min-width: 40px; }
  .aug span.sep { min-width: 0; padding: 0; margin: 0 6px; border-left: 2px solid var(--soft); }
  .aug span.rhs { color: var(--accent); font-weight: 500; }
  .aug span.chg { background: var(--accent-bg); }
  .legend { margin-bottom: 18px; }
  .sec h2:not(:first-child) { margin-top: 30px; }
  .matrix span.chg { background: var(--accent-bg); border-radius: 6px; }
  .derive { border-left: 3px solid var(--accent); padding: 2px 0 6px 16px; }
  .derive p { margin: 0 0 4px; }
  .expr { font: 500 17px var(--mono); margin: 8px 0 0; overflow-x: auto; white-space: nowrap; }
  /* stacked fractions: numerator over denominator */
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle;
          font-style: normal; font-size: .88em; line-height: 1.2; margin: 0 2px; }
  .frac em { font-style: normal; padding: 0 4px; }
  .frac em:first-child { border-bottom: 1.5px solid currentColor; }
  .ops { font: 500 16px var(--mono); color: var(--accent); margin: 0 0 4px; overflow-wrap: anywhere; }
  .line { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 10px 0; font-family: var(--mono); overflow-x: auto; }

  .steps { counter-reset: step; }
  .step { counter-increment: step; position: relative; padding-left: 44px; margin: 0 0 18px; }
  .step::before { content: counter(step); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border: 2px solid var(--accent); color: var(--accent); border-radius: 50%;
                  font: 500 13px/24px var(--mono); text-align: center; }
  .step p { margin: 0 0 4px; }
  .solution { border: 2px solid var(--accent); background: var(--paper); border-radius: 12px; padding: 14px 20px; margin-top: 10px; }
  .solution b { font-size: 15px; }
  .answer { font-size: 22px; font-weight: 500; }
  .error { border-left: 6px solid var(--g-red); border-radius: 4px; background: var(--bad-bg); padding: 14px 18px; }
  @media (max-width: 520px) { .stepper { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="top">
    <h1>Matrix Inverse &amp; Linear System Solver</h1>
    <button id="theme" aria-label="Switch between light and dark mode">☾</button>
  </div>
  <p class="muted">Solve <span class="formula">Ax = b</span>, or find <span class="formula">A⁻¹</span> and Aᵀ. Enter your equations or matrix and every step is shown.</p>
</header>

<section class="sec">
  <h2>Input</h2>
  <div class="row">
    <div class="seg">
      <label class="choice"><input type="radio" name="mode" value="system" checked>Linear System</label>
      <label class="choice"><input type="radio" name="mode" value="matrix">Matrix Equation</label>
    </div>
    <div class="stepper">Number of Variables
      <button id="less" aria-label="Fewer unknowns">−</button><b id="count">3</b><button id="more" aria-label="More unknowns">+</button>
    </div>
  </div>
  <div class="checks">
    <label class="check"><input type="checkbox" id="labels" checked>Show variable labels</label>
    <label class="check"><input type="checkbox" id="hasB" checked>Include "= b" (right-hand side)</label>
    <label class="check"><input type="checkbox" id="fractions" checked>Show answers as fractions</label>
  </div>
  <div class="rand">
    <button id="randomize" type="button">🎲 Randomize</button>
    <span class="opt">Range
      <input class="rng" id="rmin" type="number" step="any" min="-9999" max="9999" value="-9" aria-label="Smallest random number">
      to
      <input class="rng" id="rmax" type="number" step="any" min="-9999" max="9999" value="9" aria-label="Largest random number">
    </span>
    <label class="check"><input type="checkbox" id="decimals">Decimals</label>
    <label class="check"><input type="checkbox" id="solvable" checked>Always solvable</label>
  </div>
  <div id="inputs"></div>
  <div id="warning" role="alert"></div>
</section>

<section class="sec">
  <h2>Output</h2>
  <div class="row output-row">
    <div class="seg">
      <label class="choice"><input type="radio" name="output" value="solution" checked><span id="solveLabel">Solve Ax = b</span></label>
      <label class="choice"><input type="radio" name="output" value="inverse">A⁻¹</label>
      <label class="choice"><input type="radio" name="output" value="transpose">Aᵀ</label>
    </div>
    <button id="solve">Solve</button>
  </div>
  <div class="row options-row" id="optionsRow">
    <label class="check"><input type="checkbox" id="withI" checked>Show identity matrix I</label>
  </div>
</section>

<section class="sec" id="result"></section>

</div>

<script>
/*
  so paano to nagana guys, incase na tanongin tayo for the code

  The page takes the numbers you type, solves the system with exact fractions, and writes the working
  out as HTML so every step is visible. The code is in this order:

    1. Data          A, b, ops and size hold everything you typed. All output is built from these.
    2. Input rules   what the boxes accept (max 4 digits, 2 decimals, one minus sign).
    3. Fractions     numbers are stored as numerator/denominator so 1/3 never turns into 0.3333.
    4. Drawing       small functions that turn matrices into HTML (grids, stacked fractions, badges).
    5. The math      solveSystem() = Gauss-Jordan elimination. singularWork() = what to do when
                     there is no inverse.
    6. Input area    drawInputs() builds the boxes, readInputs() copies them back into A, b and ops.
    7. Randomize     fills the boxes with random numbers (and can make sure the matrix is invertible).
    8. Output        showResult() decides what to show and puts the steps into the page.
    9. Wiring        buttons and tick boxes, switching modes, remembering your numbers, dark mode.

  Yung flow
    you type -> readInputs() puts the boxes into A, b, ops
             -> you press Solve -> showResult() runs
             -> showResult() turns A and b into plain numbers, then calls solveSystem()
             -> solveSystem() returns the steps, the inverse and the solution
             -> showResult() writes them into the page (as HTML text)

  Paano hinahanap yung Inverse? (Gauss-Jordan)
    Put A and the identity matrix I side by side:  [ A | I ]
    Then apply row operations to WHOLE rows (both halves): swap two rows, divide a row by a number,
    subtract a multiple of one row from another. Keep going until the left half becomes I.
    Every operation that turned A into I was also done to the right half, so the right half has
    turned from I into A⁻¹. If b is also attached ( [ A | I | b ] ), it turns into A⁻¹b = x,
    which is the solution. That is why x = A⁻¹b with A⁻¹ on the left of b.

  Paano niya malalaman if walang inverse?
    While reducing, we need a non-zero number (a "pivot") in each column. If a column has none left,
    A can never become I, so A has no inverse. singularWork() then keeps reducing anyway and reads
    the answer from the result: a row like 0 0 0 | 5 means no solution, a row like 0 0 0 | 0 means
    infinitely many solutions.
*/

//  Data
// Everything on the page is drawn from these variables.
const MAX_UNKNOWNS = 6;   // the biggest system the page allows (the + button stops here)
const subscript = (n) => String(n).split("").map((d) => "₀₁₂₃₄₅₆₇₈₉"[d]).join("");
const names = ["x", "y", "z", "w", "v", "u"];   // names of the unknowns, in order
let labels = true;   // show the x, y, z badges? (the user can turn them off)
let size = 3;   // how many unknowns (and equations)
// A = the coefficient matrix. b = the right-hand side. Both are kept as what was typed (text), and only turned into real numbers when you press Solve.
let A = [[2, 2, -1], [1, -3, 1], [3, 1, -2]];   // starting example (machine challenge 7): 2x+2y−z=−8, x−3y+z=14, 3x+y−2z=−8
let b = [-8, 14, -8];
// In Linear System mode the + or − in front of each term lives here, one entry per number in A.
// The real value of a term is  (number in the box) × (+1 or −1 from its sign box).
let ops = [];

// ---------- Input rules ----------
// Two checks on what is typed in a box:
//  - ALLOWED_WHILE_TYPING: still a valid start of a number (optional minus, up to 4 digits, up to 2 decimals).
//    Anything else is rejected the moment it is typed, and the box goes back to its last good text.
//  - COMPLETE_NUMBER: a finished number. Used when you press Solve (so a lone "-" or "1." is refused).
const ALLOWED_WHILE_TYPING = /^-?\d{0,4}(\.\d{0,2})?$/;
const COMPLETE_NUMBER = /^-?\d+(\.\d+)?$/;

// works out which rule a rejected text broke, so the warning message can say why
function whyNotAllowed(text) {
  if (/[^0-9.\-]/.test(text)) return "Only numbers are allowed (digits, one minus sign, one decimal point).";
  if (/-.*-|.-/.test(text)) return "Use only one minus sign, and only at the start.";
  if ((text.match(/\./g) || []).length > 1) return "Only one decimal point is allowed.";
  const whole = text.replace("-", "").split(".")[0];
  if (whole.length > 4) return "Maximum 4 digits before the decimal point.";
  return "Maximum 2 decimal places.";
}

// ---------- Small helpers ----------
// $("x") is just a shorter way to write document.getElementById("x")
const $ = (id) => document.getElementById(id);
// the value of whichever radio button is ticked in a group (e.g. chosen("mode") gives "system" or "matrix")
const chosen = (name) => document.querySelector(`input[name=${name}]:checked`).value;

// ---------- Exact fractions (so 1/3 stays 1/3, never 0.3333) ----------
// Normal JavaScript numbers are decimals and drift (0.1 + 0.2 = 0.30000000000000004). That would make
// the row reduction slightly wrong. So every value in the maths is a fraction {n: top, d: bottom} made of
// BigInt (whole numbers of any size, written like 5n). A fraction is always kept in lowest terms with a
// positive bottom, so equal values look identical.
const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
// fr(6n, 4n) gives {n: 3n, d: 2n}: makes the bottom positive and cancels the common factor
function fr(n, d = 1n) {
  if (d < 0n) { n = -n; d = -d; }
  const g = gcd(n, d) || 1n;
  return { n: n / g, d: d / g };
}
// the four operations on fractions (the usual school rules: a/b + c/d = (ad + cb) / bd, and so on)
const fAdd = (a, b) => fr(a.n * b.d + b.n * a.d, a.d * b.d);
const fSub = (a, b) => fr(a.n * b.d - b.n * a.d, a.d * b.d);
const fMul = (a, b) => fr(a.n * b.n, a.d * b.d);
const fDiv = (a, b) => fr(a.n * b.d, a.d * b.n);
const fNeg = (a) => fr(-a.n, a.d);
const fAbs = (a) => fr(a.n < 0n ? -a.n : a.n, a.d);
// quick tests used by the row reduction: "is this 0?" and "is this 1?"
const fZero = (a) => a.n === 0n;
const fOne = (a) => a.n === 1n && a.d === 1n;
// the boxes allow at most 2 decimals, so multiplying by 100 gives a whole number: 2.5 becomes 250/100 = 5/2
const fFromNumber = (x) => fr(BigInt(Math.round(x * 100)), 100n);   // inputs have at most 2 decimals
const fToNumber = (a) => Number(a.n) / Number(a.d);
// accepts either a plain number or a fraction and always returns a fraction
const toFr = (x) => (typeof x === "number" ? fFromNumber(x) : x);

let asFractions = true;   // show answers as fractions (can be switched to decimals)
const MINUS = "−";

// plain text version of a number, used in sentences and row operations
// (fractions show as 7/3, or as a decimal rounded to 4 places when the decimals option is on)
function show(x) {
  const f = toFr(x);
  if (asFractions) return (f.d === 1n ? `${f.n}` : `${f.n}/${f.d}`).replace("-", MINUS);
  return String(Math.round(fToNumber(f) * 10000) / 10000 + 0).replace("-", MINUS);
}

// HTML version, used inside matrices: fractions are drawn stacked like on paper
// (the top and bottom are two small <em> tags, styled in the CSS under .frac)
function showHTML(x) {
  const f = toFr(x);
  if (!asFractions || f.d === 1n) return show(f);
  const sign = f.n < 0n ? MINUS : "";
  const top = f.n < 0n ? -f.n : f.n;
  return `${sign}<em class="frac"><em>${top}</em><em>${f.d}</em></em>`;
}

// turns a list of rows into a grid. "changed" is the list of row numbers to shade (the rows a step just changed)
function matrixHTML(rows, changed = []) {
  const cells = rows.map((row, r) => row.map((n) => `<span${changed.includes(r) ? ' class="chg"' : ""}>${showHTML(n)}</span>`).join("")).join("");
  return `<div class="matrix" style="grid-template-columns: repeat(${rows[0].length}, auto)">${cells}</div>`;
}

// a small badge for each unknown
function varBadge(i) {
  return `<i class="v v${i}">${names[i]}</i>`;
}
function namesHTML(n) {
  return `<div class="matrix">${names.slice(0, n).map((_, i) => `<span>${varBadge(i)}</span>`).join("")}</div>`;
}

// the augmented matrix ([A | I | b], [A | I] or [A | b]) with divider lines; rows that just changed are shaded.
// Each row of "rows" is laid out as: n numbers of A, then (if withI) n numbers of I, then (if hasB) one number of b.
// The thin "sep" cells are the vertical divider lines between the blocks.
function augmentedHTML(rows, n, changed = [], { withI = true, hasB = true } = {}) {
  let cells = "";
  rows.forEach((row, r) => {
    const shade = changed.includes(r) ? " chg" : "";
    const put = (v, kind = "") => `<span class="${(kind + shade).trim()}">${showHTML(v)}</span>`;
    let c = 0;
    for (; c < n; c++) cells += put(row[c]);
    if (withI) {
      cells += `<span class="sep"></span>`;
      for (; c < 2 * n; c++) cells += put(row[c]);
    }
    if (hasB) cells += `<span class="sep"></span>` + put(row[c], "rhs");
  });
  const cols = `repeat(${n}, auto)` + (withI ? ` 0px repeat(${n}, auto)` : "") + (hasB ? " 0px auto" : "");
  return `<div class="matrix aug" style="grid-template-columns: ${cols}">${cells}</div>`;
}

function columnHTML(items) {
  return `<div class="matrix">${items.map((t) => `<span>${t}</span>`).join("")}</div>`;
}

// ---------- The math: Gauss-Jordan elimination ----------
// The next two helpers only help to WRITE the row operations nicely, e.g. "R2 − (3/2)·R1 → R2".
// wrap negatives and fractions in brackets so "÷ (3/2)" reads clearly
const paren = (v) => (v.n < 0n || v.d !== 1n ? `(${show(v)})` : show(v));
// the number in front of a row in an operation like "R2 − 2·R1 → R2" (nothing when it is 1)
const coef = (f) => {
  const k = fAbs(f);
  return fOne(k) ? "" : k.d === 1n ? `${show(k)}·` : `(${show(k)})·`;
};

// solveSystem is the heart of the page. It builds the table [ A | I | b ] and does Gauss-Jordan elimination:
// for each column, (1) find a row with a non-zero number there (the pivot), (2) swap it into place,
// (3) divide that row so the pivot becomes 1, (4) subtract multiples of it from every other row so the rest
// of the column becomes 0. After the last column the left block is the identity matrix, the I block has
// become A⁻¹ and the b column has become the solution x.
// It also records every step (the text, the row operations and a copy of the table) so the page can show them.
// If a column has no pivot, A has no inverse and it returns {error: true}.
// b = null means "no right-hand side"; withI = false drops the identity block from the maths;
// showI = false keeps I in the maths (so A⁻¹ is still found) but hides it from the steps
function solveSystem(A, b, { withI = true, showI = withI } = {}) {
  showI = showI && withI;
  const n = A.length;
  const hasB = Array.isArray(b);
  const bCol = withI ? 2 * n : n;
  // the augmented table is [ A | I | b ], all exact fractions (I and b are optional)
  // (the I block is a grid of 0s with 1s on the diagonal: 1 when the row number equals the column number)
  const table = A.map((row, i) => [
    ...row.map(fFromNumber),
    ...(withI ? A.map((_, j) => fr(i === j ? 1n : 0n)) : []),
    ...(hasB ? [fFromNumber(b[i])] : []),
  ]);
  const steps = [];
  // save() stores one step: text = plain-English line, ops = row operations like "R2 − 2·R1 → R2", changed = rows that were modified
  const save = (text, ops = [], changed = []) =>
    steps.push({ text, ops, changed, rows: table.map((r) => (withI && !showI ? [...r.slice(0, n), ...r.slice(2 * n)] : [...r])) });

  const startText = showI && hasB ? "Start with the augmented matrix [A | I | b]: A on the left, the identity matrix I in the middle, b on the right."
    : showI ? "Start with the augmented matrix [A | I]: A on the left, the identity matrix I on the right."
    : hasB ? "Start with the augmented matrix [A | b]: A on the left, b on the right."
    : "Start with the matrix A.";
  save(startText);

  // one pass of this loop handles one column
  for (let col = 0; col < n; col++) {
    // (1) look downwards for the first row with a non-zero number in this column
    let pivotRow = col;
    while (pivotRow < n && fZero(table[pivotRow][col])) pivotRow++;
    // nothing found: this column can never get its 1, so A cannot become I, so there is no inverse
    if (pivotRow === n) return { error: true };

    // (2) swap the pivot row into the diagonal position if it is not already there
    if (pivotRow !== col) {
      [table[pivotRow], table[col]] = [table[col], table[pivotRow]];
      save(`Swap row ${col + 1} and row ${pivotRow + 1} so the pivot isn't zero.`,
        [`R${col + 1} ↔ R${pivotRow + 1}`], [col, pivotRow]);
    }

    // (3) divide the whole row (all blocks) by the pivot so the pivot becomes 1
    const pivot = table[col][col];
    if (!fOne(pivot)) {
      table[col] = table[col].map((v) => fDiv(v, pivot));
      save(`Divide row ${col + 1} by ${show(pivot)} to make the pivot 1.`,
        [`R${col + 1} ÷ ${paren(pivot)} → R${col + 1}`], [col]);
    }

    // (4) make every other number in this column 0: take "factor" times the pivot row away from that row.
    // "factor" is the number currently sitting in this column of that row.
    const ops = [], changedRows = [];
    for (let row = 0; row < n; row++) {
      const factor = table[row][col];
      if (row !== col && !fZero(factor)) {
        table[row] = table[row].map((v, k) => fSub(v, fMul(factor, table[col][k])));
        ops.push(`R${row + 1} ${factor.n > 0n ? "−" : "+"} ${coef(factor)}R${col + 1} → R${row + 1}`);
        changedRows.push(row);
      }
    }
    if (ops.length) save(`Clear column ${col + 1} above and below the pivot.`, ops, changedRows);
  }

  // the loop is finished: the left block is I. Now read the answers off the table.
  const hiddenNote = withI && !showI ? " Doing the same row operations to I (hidden here) gives A⁻¹." : "";
  save(showI && hasB ? "The left block is now the identity matrix I, so the middle block is A⁻¹ and the right column is the solution x."
    : showI ? "The left block is now the identity matrix I, so the right block is A⁻¹."
    : hasB ? "The left block is now the identity matrix I, so the right column is the solution x." + hiddenNote
    : "A has been reduced to the identity matrix I." + hiddenNote);

  // the I block (columns n to 2n-1) is A⁻¹, and the b column is the solution x
  return {
    steps,
    layout: { withI: showI, hasB, hiddenI: withI && !showI },   // what the steps display
    solution: hasB ? table.map((r) => r[bCol]) : undefined,
    inverse: withI ? table.map((r) => r.slice(n, 2 * n)) : undefined,
  };
}

// the short explanation printed above the steps; the wording depends on which blocks are on show
function rrefLegend({ withI, hasB, hiddenI }) {
  const parts = ["A", ...(withI ? ["I"] : []), ...(hasB ? ["b"] : [])];
  const turns = [...(withI ? ["I into A⁻¹"] : []), ...(hasB ? ["b into the solution x"] : [])];
  const shown = parts.length > 1 ? `Every matrix is [${parts.join(" | ")}].` : "Every matrix is A.";
  const what = turns.length
    ? `The row operations turn A into I, which turns ${turns.join(" and ")}.`
    : "The row operations turn A into the identity matrix I.";
  const hidden = hiddenI ? ' The identity block is still updated behind the scenes to get A⁻¹; tick "Show identity matrix I" to see it.' : "";
  return `${shown} ${what}${hidden} Shaded rows are the ones changed by that step.`;
}

// The determinant is only used by Randomize, to check a random matrix is invertible (determinant not 0).
// Method: row reduce to a triangle, multiply the diagonal, and flip the sign once for every row swap.
function determinant(M) {
  const n = M.length, t = M.map((r) => r.map(toFr));
  let d = fr(1n);
  for (let col = 0; col < n; col++) {
    let p = col;
    while (p < n && fZero(t[p][col])) p++;
    if (p === n) return fr(0n);
    if (p !== col) { [t[p], t[col]] = [t[col], t[p]]; d = fNeg(d); }
    d = fMul(d, t[col][col]);
    for (let r = col + 1; r < n; r++) {
      const f = fDiv(t[r][col], t[col][col]);
      t[r] = t[r].map((v, k) => fSub(v, fMul(f, t[col][k])));
    }
  }
  return d;
}

const br = (x) => `(${show(x)})`;   // always bracketed: (2), (−3), (1/2)

// ---------- Solving with the inverse: x = A⁻¹b (left multiplication) ----------
// whyHTML() prints the short proof: multiply both sides of Ax = b on the LEFT by A⁻¹.
function whyHTML() {
  return `<h2>Why x = A⁻¹b</h2>
    <div class="derive">
      <p class="muted">If A is invertible, Ax = b has a unique solution. Multiply both sides on the <b>left</b> by A⁻¹:</p>
      <div class="expr">Ax = b</div>
      <div class="expr">A⁻¹(Ax) = A⁻¹b</div>
      <div class="expr">(A⁻¹A)x = A⁻¹b</div>
      <div class="expr">Ix = A⁻¹b</div>
      <div class="expr">x = A⁻¹b</div>
    </div>`;
}

// leftMultiplyHTML() shows the multiplication A⁻¹ × b. Row i of A⁻¹ times the column b gives unknown i.
function leftMultiplyHTML(inverse, bf, solution) {
  const lines = inverse.map((row, i) =>
    `${names[i]} = ${row.map((v, j) => `${br(v)}${br(bf[j])}`).join(" + ")} = ${show(solution[i])}`);
  return `<h2>Multiply: x = A⁻¹b</h2>
    <p class="muted">Left multiplication: A⁻¹ goes on the left of b (b·A⁻¹ isn't even defined, because b is a column). Each row of A⁻¹ times b gives one unknown.</p>
    <div class="line">x = A⁻¹b = ${matrixHTML(inverse)} ${columnHTML(bf.map(showHTML))} = ${columnHTML(solution.map(showHTML))}</div>
    ${lines.map((l) => `<div class="expr">${l}</div>`).join("")}`;
}

// ---------- When A has no inverse: still row-reduce, and show WHY there is no unique solution ----------
// The idea: reduce as far as possible, then LOOK at the result.
//   - a column with no pivot  = a free variable (it can be any number)
//   - a row of zeros on the left with a non-zero number on the right (0 0 0 | 5) = impossible, so NO solution
//   - a row of all zeros including the right side (0 0 0 | 0) = no information, so INFINITELY many solutions
//   - no b at all = just report that A has no inverse
// a coefficient list like (2, [−1, 0]) with parameter names ["t", "s"]  →  "2 − t"
function linearExpr(constant, coefs, paramNames) {
  let out = fZero(constant) ? "" : show(constant);
  coefs.forEach((coef, k) => {
    if (fZero(coef)) return;
    const mag = fAbs(coef);
    const body = (fOne(mag) ? "" : mag.d === 1n ? show(mag) : `(${show(mag)})`) + paramNames[k];
    out = out === "" ? (coef.n < 0n ? "−" : "") + body : out + (coef.n < 0n ? " − " : " + ") + body;
  });
  return out === "" ? "0" : out;
}

// full Gauss-Jordan on [A | b] (or on A alone) that does not give up when a column has no pivot
// (same as solveSystem, but a column without a pivot is skipped instead of stopping, and at the end
// the result is classified using the rules above)
function singularWork(Anum, bnum, { showI = false } = {}) {
  const n = Anum.length;
  const hasB = Array.isArray(bnum);
  const bCol = showI ? 2 * n : n;   // where b sits: [A | b] or [A | I | b]
  const t = Anum.map((row, i) => [
    ...row.map(fFromNumber),
    ...(showI ? Anum.map((_, j) => fr(i === j ? 1n : 0n)) : []),
    ...(hasB ? [fFromNumber(bnum[i])] : []),
  ]);
  const steps = [];
  const save = (text, ops = [], changed = []) => steps.push({ text, ops, changed, rows: t.map((r) => [...r]) });
  save(showI && hasB ? "Start with the augmented matrix [A | I | b]: A on the left, the identity matrix I in the middle, b on the right."
    : showI ? "Start with the augmented matrix [A | I]: A on the left, the identity matrix I on the right."
    : hasB ? "Start with the augmented matrix [A | b]: A on the left, b on the right."
    : "Start with the matrix A.");

  const pivots = [];   // [row, column] of every pivot we manage to make
  let row = 0;
  for (let col = 0; col < n && row < n; col++) {
    let p = row;
    while (p < n && fZero(t[p][col])) p++;
    if (p === n) continue;   // nothing left to use as a pivot in this column: it will be a free variable

    if (p !== row) {
      [t[p], t[row]] = [t[row], t[p]];
      save(`Swap row ${row + 1} and row ${p + 1} so the pivot isn't zero.`, [`R${row + 1} ↔ R${p + 1}`], [row, p]);
    }
    const pivot = t[row][col];
    if (!fOne(pivot)) {
      t[row] = t[row].map((v) => fDiv(v, pivot));
      save(`Divide row ${row + 1} by ${show(pivot)} to make the pivot 1.`, [`R${row + 1} ÷ ${paren(pivot)} → R${row + 1}`], [row]);
    }
    const ops = [], changed = [];
    for (let r = 0; r < n; r++) {
      const f = t[r][col];
      if (r !== row && !fZero(f)) {
        t[r] = t[r].map((v, k) => fSub(v, fMul(f, t[row][k])));
        ops.push(`R${r + 1} ${f.n > 0n ? "−" : "+"} ${coef(f)}R${row + 1} → R${r + 1}`);
        changed.push(r);
      }
    }
    if (ops.length) save(`Clear column ${col + 1} above and below the pivot.`, ops, changed);
    pivots.push([row, col]);
    row++;
  }

  // rank = number of pivots found. Fewer pivots than unknowns means some unknowns are free.
  const rank = pivots.length;
  const pivotCols = pivots.map(([, c]) => c);
  const freeCols = [...Array(n).keys()].filter((c) => !pivotCols.includes(c));
  const zeroRows = [...Array(n).keys()].filter((r) => t[r].slice(0, n).every(fZero));
  const badRow = hasB ? zeroRows.find((r) => !fZero(t[r][bCol])) : undefined;
  const zeroList = zeroRows.map((r) => r + 1).join(zeroRows.length > 2 ? ", " : " and ");
  const rowWord = zeroRows.length === 1 ? `Row ${zeroList} has` : `Rows ${zeroList} have`;
  const zerosText = (r) => `${[...Array(n)].map(() => "0").join(" ")} | ${show(t[r][bCol])}`;

  let kind, title, summary, form = null, lines = [];
  const paramNames = freeCols.length <= 3 ? ["t", "s", "r"].slice(0, freeCols.length) : freeCols.map((_, k) => "t" + subscript(k + 1));

  if (!hasB) {
    kind = "noinverse"; title = "No inverse";
    summary = `${rowWord} turned into all zeros, so A can't be reduced to the identity matrix. The rank of A is ${rank}, which is less than ${n}, so A has no inverse.`;
  } else if (badRow !== undefined) {
    kind = "none"; title = "No solution";
    summary = `Row ${badRow + 1} became ${zerosText(badRow)}. It says 0 = ${show(t[badRow][bCol])}, which is impossible, so the system has no solution. (The rank of A is ${rank} but the rank of [A | b] is ${rank + 1}.)`;
  } else {
    kind = "infinite"; title = "Infinitely many solutions";
    const free = freeCols.map((c) => names[c]).join(", ");
    summary = `${rowWord} turned into all zeros (0 = 0), which gives no information, so there are fewer independent equations (${rank}) than unknowns (${n}). ${freeCols.length === 1 ? `The variable ${free} is` : `The variables ${free} are`} free: let ${freeCols.map((c, k) => `${names[c]} = ${paramNames[k]}`).join(", ")} (any number), and the others follow:`;
    // write every unknown in terms of the free ones: a pivot unknown = (right-hand number) − (coefficients × free unknowns)
    form = names.slice(0, n).map((_, c) => {
      const k = freeCols.indexOf(c);
      if (k >= 0) return { constant: fr(0n), coefs: freeCols.map((_, j) => fr(j === k ? 1n : 0n)) };
      const [r] = pivots.find(([, pc]) => pc === c);
      return { constant: t[r][bCol], coefs: freeCols.map((j) => fNeg(t[r][j])) };
    });
    lines = form.map((f, c) => `${names[c]} = ${linearExpr(f.constant, f.coefs, paramNames)}`);
  }

  // with I on show: row r of the I block tells which mix of the ORIGINAL rows gave the zero row
  const dependencies = showI ? zeroRows.map((r) => ({ row: r, coefs: t[r].slice(n, 2 * n) })) : [];
  const dependencyLines = dependencies.map(({ coefs }) => {
    const pieces = coefs.map((c, j) => (fZero(c) ? null : `${br(c)}·(row ${j + 1})`)).filter(Boolean);
    return `${pieces.join(" + ")} = ${[...Array(n)].map(() => "0").join(" ")}`;
  });

  return { steps, kind, title, summary, lines, form, rank, freeCols, hasB, dependencies, dependencyLines, layout: { withI: showI, hasB } };
}

// builds the page for the no-inverse case: the banner, the steps, and the final verdict box
function singularHTML(w, n) {
  const banner = w.hasB
    ? "A has no inverse, so Ax = b has no unique solution."
    : "A has no inverse.";
  const parts = ["A", ...(w.layout.withI ? ["I"] : []), ...(w.hasB ? ["b"] : [])];
  const legend = `Every matrix is ${parts.length > 1 ? `[${parts.join(" | ")}]` : "A"}. The row operations try to turn A into the identity matrix I. Shaded rows are the ones changed by that step.`
    + (w.layout.withI ? " Because A can't become I, the I block never turns into an inverse." : "");
  let html = `<div class="error">${banner} Row reduction shows why:</div>
    <h2>Steps (row reduction)</h2>
    <p class="muted legend">${legend}</p>
    <div class="steps">`;
  for (const step of w.steps) {
    const ops = step.ops.length ? `<p class="ops">${step.ops.join("  ;  ")}</p>` : "";
    html += `<div class="step">${ops}<p class="muted">${step.text}</p><div class="line">${augmentedHTML(step.rows, n, step.changed, w.layout)}</div></div>`;
  }
  html += `</div>
    <div class="solution"><b>${w.title}</b><p class="muted">${w.summary}</p>${w.lines.map((l) => `<div class="expr">${l}</div>`).join("")}`;
  if (w.dependencyLines.length) {
    html += `<p class="muted">The I block shows why the rows depend on each other. Row${w.dependencyLines.length > 1 ? "s" : ""} of the I block say that, in the original A:</p>`
      + w.dependencyLines.map((l) => `<div class="expr">${l}</div>`).join("");
  }
  html += `</div>`;
  return html;
}

// ---------- Input area ----------
// readInputs: copy what is in the boxes into A and b (each box remembers its row and column in data-row / data-col;
// the last column, number "size", is the b column)
function readInputs() {
  document.querySelectorAll("input.cell").forEach((box) => {
    const r = Number(box.dataset.row);
    const c = Number(box.dataset.col);
    if (c === size) b[r] = box.value;
    else A[r][c] = box.value;
  });
}

// resize: make A, b and ops match the current size. New cells get 1 on the diagonal and 0 elsewhere.
function resize() {
  A = Array.from({ length: size }, (_, r) =>
    Array.from({ length: size }, (_, c) => (A[r] && A[r][c] !== undefined ? A[r][c] : r === c ? 1 : 0)));
  b = Array.from({ length: size }, (_, r) => (b[r] !== undefined ? b[r] : 0));
  ops = Array.from({ length: size }, (_, r) =>
    Array.from({ length: size }, (_, c) => (ops[r] && ops[r][c]) || "+"));
}

// is the "= b" part switched on? (off = a bare matrix: no b, no solution)
const hasEquals = () => $("hasB").checked;

// one number box. data-last remembers the last valid text, so a bad key press can be undone.
function box(row, col) {
  const value = col === size ? b[row] : A[row][col];
  return `<input class="cell ${col === size ? "rhs" : labels && !(chosen("mode") === "matrix" && !hasEquals()) ? "c" + col : ""}" inputmode="decimal" maxlength="8" aria-label="Row ${row + 1}, column ${col + 1}"
            data-row="${row}" data-col="${col}" data-last="${value}" value="${value}">`;
}

// the + / − drop-down in front of a term (Linear System mode only)
function opSelect(row, col) {
  const cur = ops[row][col];
  return `<select class="op" data-row="${row}" data-col="${col}" aria-label="Operation before ${names[col]}">
    <option value="+"${cur === "+" ? " selected" : ""}>+</option>
    <option value="−"${cur === "−" ? " selected" : ""}>−</option></select>`;
}

// drawInputs builds the input boxes as an HTML string. There are three layouts:
//   Linear System   -> one line per equation:  [2] x + [3] y = [5]
//   Matrix Equation -> [A] [x] = [b] as grids
//   no "= b"        -> just the matrix
function drawInputs() {
  resize();
  $("count").textContent = size;
  $("warning").textContent = "";
  let html = "";

  if (chosen("mode") === "system") {
    for (let r = 0; r < size; r++) {
      html += `<div class="equation">`;
      for (let c = 0; c < size; c++) html += box(r, c) + (labels ? varBadge(c) : "") + (c < size - 1 ? opSelect(r, c + 1) : hasEquals() ? " =" : "");
      html += (hasEquals() ? box(r, size) : "") + `</div>`;
    }
  } else if (!hasEquals()) {
    // matrix equation without "= b": just the matrix
    let aBoxes = "";
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) aBoxes += box(r, c);
    html = `<div class="line"><div class="matrix" style="grid-template-columns: repeat(${size}, auto)">${aBoxes}</div></div>`;
  } else {
    const grid = (cols, content) =>
      `<div class="matrix" style="grid-template-columns: repeat(${cols}, auto)">${content}</div>`;
    let aBoxes = "", bBoxes = "";
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) aBoxes += box(r, c);
      bBoxes += box(r, size);
    }
    html = `<div class="line">${grid(size, aBoxes)} ${labels ? namesHTML(size) : ""} = ${grid(1, bBoxes)}</div>`;
  }
  $("inputs").innerHTML = html;
}

// remember which sign a + / − drop-down was set to
$("inputs").addEventListener("change", (event) => {
  const sel = event.target;
  if (sel.classList.contains("op")) ops[Number(sel.dataset.row)][Number(sel.dataset.col)] = sel.value;
});

// live typing check: if the new text breaks the rules, put the old text back and show a short warning
let warningTimer;
$("inputs").addEventListener("input", (event) => {
  const box = event.target;
  if (!box.classList.contains("cell")) return;

  if (ALLOWED_WHILE_TYPING.test(box.value)) {
    box.dataset.last = box.value;
    box.classList.remove("bad");
    $("warning").textContent = "";
    return;
  }

  $("warning").textContent = whyNotAllowed(box.value);
  box.value = box.dataset.last;
  box.classList.add("bad");
  clearTimeout(warningTimer);
  warningTimer = setTimeout(() => {
    box.classList.remove("bad");
    $("warning").textContent = "";
  }, 2500);
});

// ---------- Randomize ----------
// Reads the range (min to max), picks random numbers, and, if "Always solvable" is on, keeps trying new
// matrices until the determinant is not 0 (so an inverse exists). Gives up after 500 tries.
function randomize() {
  const minBox = $("rmin"), maxBox = $("rmax");
  const decimals = $("decimals").checked;
  const solvable = $("solvable").checked;
  const system = chosen("mode") === "system";

  let lo = Number(minBox.value), hi = Number(maxBox.value);
  const fail = (msg, ...boxes) => {
    $("warning").textContent = msg;
    [minBox, maxBox].forEach((x) => x.classList.toggle("bad", boxes.includes(x)));
  };
  [minBox, maxBox].forEach((x) => x.classList.remove("bad"));

  if (minBox.value.trim() === "" || maxBox.value.trim() === "" || !isFinite(lo) || !isFinite(hi))
    return fail("Enter both a smallest and a largest number for the range.", minBox, maxBox);
  if (Math.abs(lo) > 9999 || Math.abs(hi) > 9999)
    return fail("Range numbers can be at most 9999 (the boxes hold 4 digits).", minBox, maxBox);
  if (lo > hi) {   // min and max entered the wrong way round: swap them
    [lo, hi] = [hi, lo];
    [minBox.value, maxBox.value] = [maxBox.value, minBox.value];
  }
  if (!decimals) {
    lo = Math.ceil(lo); hi = Math.floor(hi);
    if (lo > hi) return fail("No whole number fits in that range. Widen it or turn on Decimals.", minBox, maxBox);
  }

  const pick = () => {
    const v = decimals
      ? Math.min(hi, Math.max(lo, Math.round((lo + Math.random() * (hi - lo)) * 10) / 10))
      : lo + Math.floor(Math.random() * (hi - lo + 1));
    return v + 0;   // turns -0 into 0
  };

  // build a random matrix M; repeat while it is (almost) singular
  let M, tries = 0;
  do {
    M = Array.from({ length: size }, () => Array.from({ length: size }, pick));
    tries++;
  } while (solvable && Math.abs(fToNumber(determinant(M))) < 0.5 && tries < 500);

  const stuck = solvable && Math.abs(fToNumber(determinant(M))) < 0.5;
  b = Array.from({ length: size }, pick);
  ops = Array.from({ length: size }, () => Array(size).fill("+"));

  if (system) {
    // in a system the sign goes in the + / − box, so the number itself stays positive
    A = M.map((row, r) => row.map((v, c) => {
      if (c > 0 && v < 0) { ops[r][c] = "−"; return -v; }
      return v;
    }));
  } else {
    A = M;
  }

  drawInputs();
  showResult();
  if (stuck) $("warning").textContent = "That range is too narrow to guarantee a solvable system. Widen it for better results.";
}

// ---------- Output area ----------
// showResult is what runs when you press Solve. In order:
//   1. read the boxes and refuse if any box is not a complete number
//   2. turn the typed text into real numbers (applying the + / − boxes in Linear System mode)
//   3. Transpose? just swap rows and columns and stop
//   4. otherwise call solveSystem(); if there is no inverse, show singularWork()'s explanation instead
//   5. otherwise write out: the inverse (if asked), the steps, the x = A⁻¹b multiplication and the solution
function showResult() {
  readInputs();
  const out = $("result");

  let allGood = true;
  document.querySelectorAll("input.cell").forEach((box) => {
    const good = COMPLETE_NUMBER.test(box.value);
    box.classList.toggle("bad", !good);
    if (!good) allGood = false;
  });
  if (!allGood) {
    out.innerHTML = `<div class="error">Fill every box with a complete number, like 3, -2 or 0.5. A lone "-" or "1." is not valid.</div>`;
    return;
  }

  // in Linear System mode, a "−" in front of a term flips the sign of its number (see "ops" at the top)
  const mode = chosen("mode");
  const plain = !hasEquals();   // no "= b": there is no b, so no solution
  const flip = mode === "system";
  const numbersA = A.map((row, r) => row.map((v, c) => Number(v) * (flip && c > 0 && ops[r][c] === "−" ? -1 : 1)));
  const numbersB = plain ? null : b.map(Number);

  // Transpose: entry (row r, column c) of A becomes entry (row c, column r)
  if (chosen("output") === "transpose") {
    const T = numbersA[0].map((_, c) => numbersA.map((row) => row[c]));
    out.innerHTML = `<h2>Transpose</h2><div class="solution"><div class="line answer">Aᵀ = ${matrixHTML(T)}</div></div>` +
      `<p class="muted">Rows of A become columns of Aᵀ.</p>`;
    return;
  }

  // From here on it is the row-reduction output. The inverse always needs the I block in the maths;
  // the "Show identity matrix I" tick box only decides whether the steps DISPLAY it.
  const wantInverse = chosen("output") === "inverse";
  const showI = $("withI").checked;       // "Show identity matrix I": only changes what the steps display
  const withI = wantInverse || showI;     // but A⁻¹ itself always needs I behind the scenes
  const result = solveSystem(numbersA, numbersB, { withI, showI });

  if (result.error) {
    // no inverse: don't just stop, row-reduce anyway and show why there is no unique solution
    out.innerHTML = singularHTML(singularWork(numbersA, numbersB, { showI: $("withI").checked }), size);
    return;
  }

  let html = "";

  if (wantInverse) {
    html += `<h2>Inverse</h2><div class="line answer">A⁻¹ = ${matrixHTML(result.inverse)}</div>`;
  }

  // solving Ax = b "using the inverse": show why x = A⁻¹b before finding A⁻¹
  if (!plain && !wantInverse && result.inverse) html += whyHTML();

  html += `<h2>Steps (Gauss-Jordan)</h2>
    <p class="muted legend">${rrefLegend(result.layout)}</p>
    <div class="steps">`;
  for (const step of result.steps) {
    const ops = step.ops.length ? `<p class="ops">${step.ops.join("  ;  ")}</p>` : "";
    html += `<div class="step">${ops}<p class="muted">${step.text}</p><div class="line">${augmentedHTML(step.rows, size, step.changed, result.layout)}</div></div>`;
  }
  html += `</div>`;

  if (!plain) {
    const bFr = numbersB.map(fFromNumber);
    if (result.inverse) html += leftMultiplyHTML(result.inverse, bFr, result.solution);
    else html += `<p class="muted note">Row reduction on [A | b] solves for x directly, without finding A⁻¹. Tick "Show identity matrix I" to see x = A⁻¹b.</p>`;
    html += `<div class="solution"><b>Solution</b>
      <div class="line answer">${labels ? namesHTML(size) + " =" : ""} ${columnHTML(result.solution.map(showHTML))}</div></div>`;
  }

  out.innerHTML = html;
}

// ---------- Wire up the page ----------
// This part connects the buttons, tick boxes and radio buttons to the functions above.
// show only the controls that make sense for the current input mode and output
// syncControls: grey out "Solve Ax = b" when there is no "= b", and hide the identity tick box for Transpose
function syncControls() {
  const plain = !hasEquals();
  const solutionRadio = document.querySelector("input[name=output][value=solution]");
  solutionRadio.disabled = plain;   // a solution needs a b
  $("solveLabel").textContent = plain ? "Solve Ax = b (needs = b)" : "Solve Ax = b";
  if (plain && solutionRadio.checked) document.querySelector("input[name=output][value=inverse]").checked = true;

  const kind = chosen("output");
  $("optionsRow").hidden = !(kind === "solution" || kind === "inverse");
}

// ---------- Keeping Linear System and Matrix Equation in step ----------
// (so both modes always describe the same equations)
// In Linear System mode the sign of a term lives in its + / − box; Matrix Equation has no such boxes, so the sign
// has to live in the number itself. Switching modes converts between the two so both show the same equations.
let currentMode = "system";
// flips the sign of a typed number as text ("3" <-> "-3"), leaving half-typed boxes and 0 alone
const negateText = (v) => (!COMPLETE_NUMBER.test(v) || Number(v) === 0 ? v : v.startsWith("-") ? v.slice(1) : "-" + v);

// Linear System style: every number after the first in a row is shown without its sign, the sign goes in the box
function normalizeSystemSigns() {
  for (let r = 0; r < size; r++) for (let c = 1; c < size; c++) {
    const v = String(A[r][c]);
    if (!COMPLETE_NUMBER.test(v)) continue;   // half-typed boxes are left alone
    const negative = v.startsWith("-") !== (ops[r][c] === "−");   // the sign the term really has
    const magnitude = v.startsWith("-") ? v.slice(1) : v;
    A[r][c] = magnitude;
    ops[r][c] = negative && Number(magnitude) !== 0 ? "−" : "+";
  }
}

// called when you switch modes: moves the signs between the + / − boxes (system) and the numbers themselves (matrix)
function convertSigns(from, to) {
  if (from === to) return;
  if (from === "system") {
    // Linear System → Matrix Equation: move each − into its number
    for (let r = 0; r < size; r++) for (let c = 1; c < size; c++) {
      const v = String(A[r][c]);
      if (!COMPLETE_NUMBER.test(v)) continue;
      if (ops[r][c] === "−") A[r][c] = negateText(v);
      ops[r][c] = "+";
    }
  } else {
    // Matrix Equation → Linear System: move each minus sign out of its number into the box
    ops = Array.from({ length: size }, () => Array(size).fill("+"));
    normalizeSystemSigns();
  }
}

document.querySelectorAll("input[name=mode]").forEach((r) =>
  r.addEventListener("change", () => {
    readInputs();
    const next = chosen("mode");
    convertSigns(currentMode, next);
    currentMode = next;
    syncControls();
    drawInputs();
  }));
// the buttons and tick boxes
$("hasB").onchange = () => { readInputs(); syncControls(); drawInputs(); };
document.querySelectorAll("input[name=output]").forEach((r) =>
  r.addEventListener("change", syncControls));
$("more").onclick = () => { readInputs(); if (size < MAX_UNKNOWNS) size++; drawInputs(); };
$("less").onclick = () => { readInputs(); if (size > 2) size--; drawInputs(); };
$("solve").onclick = showResult;
$("randomize").onclick = randomize;
$("fractions").onchange = (e) => { asFractions = e.target.checked; showResult(); };
$("labels").onchange = (e) => { readInputs(); labels = e.target.checked; drawInputs(); showResult(); };

// ---------- Remember your numbers and choices (so a new version of this file doesn't make you retype them) ----------
// The browser's localStorage keeps small pieces of text for this page even after you close it.
// saveState() stores your numbers and choices as one piece of JSON text; loadState() reads them back
// when the page opens. Both are wrapped in try/catch because some browsers block storage for local files.
const STORE_KEY = "matrix-solver-state-v1";

function saveState() {
  try {
    readInputs();
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v: 1, size, A, b, ops, labels, asFractions,
      mode: chosen("mode"), output: chosen("output"),
      hasB: $("hasB").checked, withI: $("withI").checked,
      rmin: $("rmin").value, rmax: $("rmax").value, decimals: $("decimals").checked, solvable: $("solvable").checked,
    }));
  } catch (e) { /* storage blocked (e.g. in a preview): just don't remember */ }
}

// loadState checks the saved data is sensible (right size, square matrices) before using it
function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!d || d.v !== 1) return;
    const n = d.size;
    const square = (m) => Array.isArray(m) && m.length === n && m.every((r) => Array.isArray(r) && r.length === n);
    if (!(Number.isInteger(n) && n >= 2 && n <= MAX_UNKNOWNS && square(d.A) && square(d.ops) && Array.isArray(d.b) && d.b.length === n)) return;

    size = n;
    A = d.A.map((r) => r.map(String));
    b = d.b.map(String);
    ops = d.ops.map((r) => r.map((o) => (o === "−" ? "−" : "+")));
    labels = !!d.labels;      $("labels").checked = labels;
    asFractions = !!d.asFractions;   $("fractions").checked = asFractions;
    $("hasB").checked = !!d.hasB;
    $("withI").checked = !!d.withI;
    $("decimals").checked = !!d.decimals;
    $("solvable").checked = !!d.solvable;
    if (d.rmin !== undefined) $("rmin").value = String(d.rmin);
    if (d.rmax !== undefined) $("rmax").value = String(d.rmax);
    for (const name of ["mode", "output"]) {   // (an old saved choice that no longer exists is simply skipped)
      const radio = document.querySelector(`input[name=${name}][value=${d[name]}]`);
      if (radio) radio.checked = true;
    }
  } catch (e) { /* nothing saved yet, or storage blocked */ }
}

// save shortly after anything changes (the small delay avoids saving on every single key press)
let saveTimer;
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 200); };
["input", "change", "click"].forEach((type) => document.addEventListener(type, saveSoon));

// light / dark mode para maangas
// The colours are CSS variables (see the top of the file). Setting data-theme on the page switches which set is used.
const root = document.documentElement;
function setTheme(mode) {
  root.dataset.theme = mode;
  $("theme").textContent = mode === "dark" ? "☀" : "☾";   // shows the mode you will switch to
}
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
$("theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

// startUp runs once when the page opens: load saved numbers, tidy the signs, draw the boxes, show a first result
function startUp() {
  loadState();
  currentMode = chosen("mode");
  resize();
  if (currentMode === "system") normalizeSystemSigns();   // e.g. "+ −1z" is shown as "− 1z"
  syncControls();
  drawInputs();
  showResult();
}
startUp();
</script>
</body>
</html>
